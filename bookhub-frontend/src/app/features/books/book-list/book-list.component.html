<div class="book-list">
  <h1>📚 Liste des livres ({{ total }})</h1>

  <div *ngIf="loading" class="loading">Chargement…</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <table *ngIf="!loading && !error && books.length > 0">
    <thead>
    <tr>
      <th>Titre</th>
      <th>Auteur</th>
      <th>Prix</th>
      <th>Statut</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let book of books">
      <td><strong>{{ book.title }}</strong></td>
      <td>{{ book.author }}</td>
      <td class="price">{{ book.price.amount }} {{ book.price.currency }}</td>
      <td>{{ book.status }}</td>
    </tr>
    </tbody>
  </table>

  <p *ngIf="!loading && !error && books.length === 0">
    Aucun livre trouvé.
  </p>
</div>
