spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        cache:
          use_second_level_cache: false   # ← Désactive le L2
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never     # en prod, tables créées par Flyway V7
app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-ms: 3600000
    refresh-expiration-days: 7
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  batch:
    scheduler:
      enabled: true
      statistics-cron: "0 0 2 * * *"
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always