spring:
  application:
    name: bookhub-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/bookhub
    username: ${POSTGRES_USER:bookhub}
    password: ${POSTGRES_PASSWORD:bookhub}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.bookhub: DEBUG
    org.hibernate.SQL: DEBUG